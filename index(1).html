<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SILVA OUTLET</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#c9a44c;--bg:#090909}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f1e8;font:16px Arial}
header{padding:18px 5%;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font: bold 24px Georgia;color:var(--gold);letter-spacing:3px}nav{display:flex;gap:15px;align-items:center}a{color:inherit;text-decoration:none}
button{padding:11px 15px;background:var(--gold);color:#111;border:0;border-radius:3px;font-weight:bold}
.secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.hero{text-align:center;padding:65px 15px;background:linear-gradient(110deg,#080808,#211b10);border-bottom:1px solid #40331b}
.hero p{color:#aaa;letter-spacing:2px;text-transform:uppercase;font-size:12px}.hero h1{font:clamp(34px,7vw,58px) Georgia;color:var(--gold);margin:15px 0}
main{max-width:1150px;margin:auto;padding:30px 5%}h2{font:27px Georgia;color:var(--gold);font-weight:normal}
.tools{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input,select,textarea{background:#151515;color:white;border:1px solid #444;padding:12px;border-radius:3px}.tools input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}.product{background:#151515;border:1px solid #333}.product img,.placeholder{width:100%;aspect-ratio:4/5;object-fit:cover}.placeholder{display:grid;place-items:center;color:#888}.info{padding:12px}.price{color:var(--gold);font-size:19px;font-weight:bold}.meta{color:#aaa;font-size:12px}footer{text-align:center;color:#888;padding:35px;border-top:1px solid #333}
dialog{background:#151515;color:white;border:1px solid var(--gold);width:min(430px,94vw)}dialog input,dialog select,dialog textarea{width:100%;margin:7px 0 12px}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none}
@media(max-width:550px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head>
<body>
<header><a class="brand" href="#">SILVA OUTLET</a><nav><a href="#catalogo">Catálogo</a><button class="secondary" id="loginBtn">Entrar</button><button id="adminBtn" class="hidden">Painel</button></nav></header>
<section class="hero"><p>Moda masculina e feminina</p><h1>Vista sua personalidade.</h1><a href="#catalogo"><button>Explorar coleção</button></a></section>
<main id="catalogo"><h2>Catálogo</h2><div class="tools"><input id="search" placeholder="Buscar produto..."><select id="category"><option value="">Todas as categorias</option><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option><option value="acessorios">Acessórios</option></select></div><div id="products" class="grid">Carregando...</div><p id="status" class="meta"></p></main>
<footer>© <span id="year"></span> SILVA OUTLET</footer>
<dialog id="loginDialog"><h2>Entrar</h2><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><div class="row"><button id="signIn">Entrar</button><button class="secondary" id="closeLogin">Fechar</button></div><p id="loginMessage" class="meta"></p></dialog>
<dialog id="adminDialog"><h2>Painel administrativo</h2><p class="meta">Cadastre produtos. As fotos devem estar no bucket público produtos do Supabase.</p><label>Nome</label><input id="pname"><label>Descrição</label><textarea id="pdesc"></textarea><label>Preço em R$</label><input id="pprice" type="number" min="0" step=".01"><label>Categoria</label><select id="pgender"><option value="masculino">Masculino</option><option value="feminino">Feminino</option><option value="unissex">Unissex</option><option value="acessorios">Acessórios</option></select><label>URL pública da foto</label><input id="pimage" type="url"><div class="row"><button id="saveProduct">Salvar produto</button><button class="secondary" id="closeAdmin">Fechar</button></div><p id="adminMessage" class="meta"></p></dialog>
<script>
const db=window.supabase.createClient('https://lqsqrjovqascdccutsxc.supabase.co','sb_publishable_TDscfXmWIWqz60P9-iA_vw_UcZgMmvE');
const $=id=>document.getElementById(id);let products=[],isAdmin=false;$('year').textContent=new Date().getFullYear();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function render(){let term=$('search').value.toLowerCase(),cat=$('category').value;let arr=products.filter(p=>(!cat||p.gender===cat)&&(!term||p.name.toLowerCase().includes(term)));$('products').innerHTML=arr.length?arr.map(p=>`<article class="product">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'<div class="placeholder">SILVA OUTLET</div>'}<div class="info"><b>${esc(p.name)}</b><p class="price">${money(p.price)}</p><p class="meta">${esc(p.gender)}</p>${p.description?`<p class="meta">${esc(p.description)}</p>`:''}</div></article>`).join(''):'<p class="meta">Nenhum produto cadastrado ainda.</p>'}
async function load(){let {data,error}=await db.from('products').select('id,name,description,price,image_url,gender').eq('active',true).order('created_at',{ascending:false});if(error){$('products').textContent='Erro ao carregar catálogo. Verifique a configuração.';$('status').textContent=error.message;return}products=data||[];render();$('status').textContent=products.length+' produto(s) no catálogo.'}
async function check(){let {data:{user}}=await db.auth.getUser();if(!user){isAdmin=false;$('adminBtn').classList.add('hidden');$('loginBtn').textContent='Entrar';return}let {data}=await db.from('profiles').select('role').eq('id',user.id).maybeSingle();isAdmin=data?.role==='admin';$('adminBtn').classList.toggle('hidden',!isAdmin);$('loginBtn').textContent='Sair'}
$('search').oninput=render;$('category').onchange=render;
$('loginBtn').onclick=async()=>{let {data:{user}}=await db.auth.getUser();if(user){await db.auth.signOut();check()}else $('loginDialog').showModal()};
$('closeLogin').onclick=()=>$('loginDialog').close();$('signIn').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMessage').textContent=error?error.message:'Login realizado';if(!error){$('loginDialog').close();check()}};
$('adminBtn').onclick=()=>$('adminDialog').showModal();$('closeAdmin').onclick=()=>$('adminDialog').close();
$('saveProduct').onclick=async()=>{if(!isAdmin)return;let name=$('pname').value.trim(),price=Number($('pprice').value);if(!name||!Number.isFinite(price)||price<0){$('adminMessage').textContent='Informe nome e preço válido.';return}let {error}=await db.from('products').insert({name,description:$('pdesc').value,price,gender:$('pgender').value,image_url:$('pimage').value||null,active:true});$('adminMessage').textContent=error?error.message:'Produto cadastrado!';if(!error){['pname','pdesc','pprice','pimage'].forEach(id=>$(id).value='');load()}};
db.auth.onAuthStateChange(()=>setTimeout(check,0));check();load();
</script></body></html>
